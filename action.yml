name: 'Etuki AI Cost & Context-Cliff Regression Gate'
description: 'Deterministic 12-vector LLM token cost, prefix-cache & PR cost-regression gate (+10% avg cost / +15% P95 / 90 quality floor)'
author: 'Etuki Intelligence'
inputs:
  model:
    description: 'Model ID to evaluate'
    required: false
    default: 'claude-fable-5-2'
  in_tokens:
    description: 'Input tokens'
    required: false
    default: '60000'
  out_tokens:
    description: 'Output tokens'
    required: false
    default: '4000'
  req_id:
    description: 'Unique request identifier'
    required: false
    default: 'gh-action-gate'
runs:
  using: 'composite'
  steps:
    - name: Run 12 Deterministic Self-Test Vectors
      shell: bash
      run: node ${{ github.action_path }}/etuki-gate.mjs --test
    - name: Evaluate Workload Policy Gate
      shell: bash
      run: node ${{ github.action_path }}/etuki-gate.mjs --model "${{ inputs.model }}" --in "${{ inputs.in_tokens }}" --out "${{ inputs.out_tokens }}" --req-id "${{ inputs.req_id }}" --pre-tokenized
